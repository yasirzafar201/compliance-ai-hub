services:
  - type: web
    name: clauseverify-ai
    env: python
    buildCommand: "pip install fastapi uvicorn pydantic python-multipart"
    startCommand: "python -m uvicorn app:app --host 0.0.0.0 --port 8000"
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ANTHROPIC_API_KEY
        sync: false
