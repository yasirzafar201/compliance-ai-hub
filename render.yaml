services:
  - type: web
    name: clauseverify-ai
    env: python
    buildCommand: "pip install -r requirements.txt || pip install fastapi uvicorn pydantic python-multipart"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ANTHROPIC_API_KEY
        sync: false
